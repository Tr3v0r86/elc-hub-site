<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ELC Hub</title>
  <meta name="description" content="ELC Hub — something new is coming.">
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@500;600&family=Space+Mono&display=swap" rel="stylesheet">
  <style>
    :root{
      --paper:#F4F2EA; --white:#FBFAF6;
      --ink:#1F1F21; --charcoal:#39393B; --muted:#6F6D64;
      --purple:#7D639B; --aubergine:#33254A; --gold:#AC9D71; --red:#A8443A;
      --hanken:"Hanken Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      --mono:"Space Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;}
    body{
      font-family:var(--hanken);
      background:var(--paper);
      color:var(--ink);
      display:flex;align-items:center;justify-content:center;
      min-height:100vh;padding:32px;
      -webkit-font-smoothing:antialiased;
    }
    .card{text-align:center;max-width:520px;}
    .mark{width:40px;height:40px;display:block;margin:0 auto 28px;}
    .wordmark{
      font-family:var(--hanken);font-weight:600;
      font-size:clamp(34px,7vw,52px);letter-spacing:-0.02em;
      color:var(--aubergine);line-height:1;
    }
    .soon{
      font-family:var(--mono);text-transform:uppercase;letter-spacing:0.18em;
      font-size:11px;color:var(--muted);margin-top:22px;
    }
    .soon::before{content:"// ";color:var(--red);}
  </style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <circle cx="32" cy="32" r="24" stroke="#7D639B" stroke-width="4"/>
      <line x1="32" y1="4" x2="32" y2="16" stroke="#A8443A" stroke-width="4" stroke-linecap="round"/>
      <circle cx="32" cy="32" r="5.5" fill="#7D639B"/>
    </svg>
    <h1 class="wordmark">ELC&nbsp;Hub</h1>
    <p class="soon">Coming soon</p>
  </main>
</body>
</html>
