<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ELC Portal idea board</title>
<style>
/* Token VALUES copied from site/assets/tokens.css (internal tooling copy; keep consistent, does not ship to parents). */
:root{
  --paper:#F4F2EA; --paper-2:#ECE9DF; --white:#FBFAF6;
  --ink:#1F1F21; --charcoal:#39393B; --muted:#6F6D64; --faint:#9C9889;
  --rule:#D8D3C6; --rule-2:#E6E2D7;
  --purple:#7D639B; --purple-tint:#ECE5F2; --aubergine:#33254A;
  --gold:#AC9D71; --gold-deep:#8A7A3F; --gold-tint:#EFE9D6;
  --red:#A8443A; --sage:#5B7A4A;
  --sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Newsreader","Times New Roman",Georgia,serif;
  --mono:"Space Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --shadow-hard:3px 3px 0 rgba(31,31,33,0.10);
}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.45}
header{background:var(--aubergine);color:var(--white);font-family:var(--mono);font-size:14px;padding:12px 20px;letter-spacing:.02em}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--paper-2)}
.tabs{display:flex;gap:6px}
.tabs button{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--rule);background:var(--white);color:var(--charcoal);cursor:pointer;border-radius:3px}
.tabs button[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:var(--white)}
select,input[type="search"]{font-family:var(--sans);font-size:14px;padding:6px 10px;border:1px solid var(--rule);background:var(--white);color:var(--ink);border-radius:3px}
input[type="search"]{min-width:220px}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
#list{max-width:920px;margin:0 auto;padding:16px 20px 60px}
.row{display:flex;gap:16px;padding:14px 16px;margin-bottom:10px;background:var(--white);border:1px solid var(--rule-2);border-radius:4px;box-shadow:var(--shadow-hard)}
.votes{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px}
.votes button{font-family:var(--mono);font-size:13px;padding:4px 10px;border:1px solid var(--rule);background:var(--paper);color:var(--charcoal);cursor:pointer;border-radius:3px;width:100%}
.votes button.up[aria-pressed="true"]{background:var(--purple-tint);border-color:var(--purple);color:var(--purple)}
.votes button.down[aria-pressed="true"]{background:var(--gold-tint);border-color:var(--gold-deep);color:var(--gold-deep)}
.net{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--charcoal)}
.body h2{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:4px}
.wow{color:var(--gold-deep)}
.chips{margin-bottom:6px}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:1px 7px;margin-right:6px}
.chip.suggested{background:var(--gold-tint);border-color:var(--gold-deep);color:var(--gold-deep)}
#add{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--gold-deep);background:var(--gold-tint);color:var(--gold-deep);cursor:pointer;border-radius:3px}
#suggest{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--paper-2)}
#suggest input,#suggest textarea{font-family:var(--sans);font-size:14px;padding:6px 10px;border:1px solid var(--rule);background:var(--white);color:var(--ink);border-radius:3px}
#suggest textarea{flex:1 1 100%;resize:vertical}
#s-title{min-width:260px}
#suggest button{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--purple);background:var(--purple);color:var(--white);cursor:pointer;border-radius:3px}
#s-msg{font-size:13px;color:var(--muted)}
#s-msg.err{color:var(--red)}
#suggest input[name="website"]{display:none}
.body p{font-size:14px;color:var(--charcoal)}
.body .value{color:var(--muted);margin-top:3px}
@media (prefers-reduced-motion: no-preference){ .votes button{transition:background .15s} }
</style>
</head>
<body>
<header>ELC Portal · idea board · internal</header>
<div class="tools">
  <div class="tabs" role="group" aria-label="bucket">
    <button data-bucket="" aria-pressed="true">All</button>
    <button data-bucket="aug" aria-pressed="false">August draft</button>
    <button data-bucket="backlog" aria-pressed="false">Backlog</button>
    <button data-bucket="never" aria-pressed="false">Never</button>
    <button data-bucket="suggested" aria-pressed="false" id="tab-suggested" hidden>Suggested · 0</button>
  </div>
  <select id="lens" aria-label="lens"><option value="">all lenses</option></select>
  <input id="q" type="search" placeholder="search ideas" aria-label="search ideas">
  <button id="add" type="button" aria-expanded="false">Add an idea</button>
  <span id="count" class="count"></span>
</div>
<form id="suggest" hidden>
  <input id="s-title" placeholder="Idea title" required maxlength="90" aria-label="idea title">
  <textarea id="s-what" rows="2" placeholder="What is it and who does it help?" required maxlength="280" aria-label="what it is"></textarea>
  <input id="s-by" placeholder="Your name (optional)" maxlength="60" aria-label="your name">
  <input name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
  <button type="submit">Submit idea</button>
  <span id="s-msg" role="status"></span>
</form>
<div id="list"></div>
<script>
// Token rides the link once, then sticks per device (issue 0033): a bookmarked
// or token-stripped share of this URL still gets live counts + working votes.
const qk = new URL(location).searchParams.get('k');
if (qk) try { localStorage['elc-board-k'] = qk; } catch {}
const K = qk || localStorage['elc-board-k'] || '';
const voter = localStorage['elc-board-voter'] ||= crypto.randomUUID();
const mine = JSON.parse(localStorage['elc-board-votes'] || '{}');
const BUCKETS = { aug: 'August draft', backlog: 'Backlog', never: 'Never' };
let ideas = [], suggestions = [], votes = {}, bucket = '', lens = '', q = '';
let live = false;   // votes API reachable with a working token; false = read-only, never fake a vote

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Same-origin when served by the Worker; absolute when hosted statically at elc-hub.com/ideas/.
const API = location.hostname.endsWith('workers.dev') ? '' : 'https://elc-idea-board.elcportal.workers.dev';
const score = i => votes[i.id]?.score || 0;

async function load() {
  ideas = await (await fetch('ideas.json')).json();
  try {
    const r = await fetch(API + '/api/votes?k=' + encodeURIComponent(K));
    votes = r.ok ? await r.json() : {};
    live = r.ok;
  } catch { votes = {}; live = false; }   // API down or no token: read-only, page still renders
  try {
    const r = await fetch(API + '/api/suggestions?k=' + encodeURIComponent(K));
    if (r.ok) { suggestions = await r.json(); suggestedTab(); }
  } catch {}                           // API down: Suggested tab stays hidden
  const sel = document.getElementById('lens');
  [...new Set(ideas.map(i => i.lens))].sort().forEach(l => sel.add(new Option(l, l)));
  render();
}

function suggestedTab() {
  const t = document.getElementById('tab-suggested');
  t.hidden = false;
  t.textContent = 'Suggested · ' + suggestions.length;
}

// Suggestions render as idea rows: no lens or effort, so a lens filter hides them.
const asRow = s => ({ id: s.id, name: s.name, what: s.what, value: s.by ? 'suggested by ' + s.by : '', lens: '', decision: 'suggested', wow: false });

function render() {
  const ql = q.toLowerCase();
  const all = ideas.concat(suggestions.map(asRow));
  const rows = all
    .filter(i => (!bucket || i.decision === bucket) && (!lens || i.lens === lens) &&
                 (!ql || (i.name + ' ' + i.what + ' ' + i.value).toLowerCase().includes(ql)))
    .sort((a, b) => score(b) - score(a) || a.name.localeCompare(b.name));   // score desc, name tiebreak
  document.getElementById('count').textContent = rows.length + ' of ' + all.length + ' ideas' + (live ? '' : ' · read-only view, open from the project window to vote');
  document.getElementById('list').innerHTML = rows.map(i => {
    const v = votes[i.id] || { up: 0, down: 0, score: 0 };
    const my = mine[i.id] || 0;
    const chips = i.decision === 'suggested'
      ? '<span class="chip suggested">suggested</span>'
      : `<span class="chip">${BUCKETS[i.decision] || esc(i.decision)}</span><span class="chip">effort ${esc(i.effort)}</span><span class="chip">${esc(i.lens)}</span>`;
    return `<article class="row" data-id="${i.id}">
      <div class="votes">
        <button type="button" class="up" aria-pressed="${my === 1}" aria-label="upvote ${esc(i.name)}" onclick="vote('${i.id}',1)"${live ? '' : ' disabled title="Read-only view: open the board from the project window to vote"'}>▲ +${v.up}</button>
        <span class="net">${v.score > 0 ? '+' : ''}${v.score}</span>
        <button type="button" class="down" aria-pressed="${my === -1}" aria-label="downvote ${esc(i.name)}" onclick="vote('${i.id}',-1)"${live ? '' : ' disabled title="Read-only view: open the board from the project window to vote"'}>▼ -${v.down}</button>
      </div>
      <div class="body">
        <h2>${esc(i.name)}${i.wow ? ' <span class="wow" title="wow idea">★</span>' : ''}</h2>
        <p class="chips">${chips}</p>
        <p>${esc(i.what)}</p>
        <p class="value">${esc(i.value)}</p>
      </div>
    </article>`;
  }).join('');
}

async function vote(id, dir) {
  if (!live) return;                               // read-only: never fake a vote that will not persist
  const prev = mine[id] || 0;
  const next = prev === dir ? 0 : dir;             // tap again = retract
  mine[id] = next; localStorage['elc-board-votes'] = JSON.stringify(mine);
  const v = votes[id] || { up: 0, down: 0, score: 0 };
  if (prev === 1) v.up = Math.max(0, v.up - 1);
  if (prev === -1) v.down = Math.max(0, v.down - 1);
  if (next === 1) v.up++;
  if (next === -1) v.down++;
  v.score = v.up - v.down;
  votes[id] = v;
  render();                                        // optimistic
  try {
    const r = await fetch(API + '/api/vote?k=' + encodeURIComponent(K), { method: 'POST', body: JSON.stringify({ id, voter, dir: next }) });
    if (r.ok) { votes[id] = await r.json(); render(); }   // authoritative counts re-sort the page
  } catch {}                                       // API down: keep optimistic local counts
}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  bucket = b.dataset.bucket;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
document.getElementById('lens').addEventListener('change', e => { lens = e.target.value; render(); });
document.getElementById('q').addEventListener('input', e => { q = e.target.value; render(); });

document.getElementById('add').addEventListener('click', e => {
  const f = document.getElementById('suggest');
  f.hidden = !f.hidden;
  e.target.setAttribute('aria-expanded', String(!f.hidden));
  if (!f.hidden) document.getElementById('s-title').focus();
});

document.getElementById('suggest').addEventListener('submit', async e => {
  e.preventDefault();                                  // required fields already checked natively
  const msg = document.getElementById('s-msg');
  const body = {
    name: document.getElementById('s-title').value.trim(),
    what: document.getElementById('s-what').value.trim(),
    by: document.getElementById('s-by').value.trim(),
    website: e.target.elements.website.value
  };
  msg.className = ''; msg.textContent = '';
  try {
    const r = await fetch(API + '/api/suggest?k=' + encodeURIComponent(K), { method: 'POST', body: JSON.stringify(body) });
    const out = r.ok ? await r.json() : {};
    if (!out.ok) throw 0;
    if (out.id) { suggestions.push({ id: out.id, name: body.name, what: body.what, by: body.by }); suggestedTab(); }
    e.target.reset();
    msg.textContent = 'Thanks. Your idea is on the board.';
    render();
  } catch {
    msg.className = 'err';
    msg.textContent = 'Could not save your idea. Try again, or email trevorc@elc.ac.th.';
  }
});
load();
</script>
</body>
</html>
