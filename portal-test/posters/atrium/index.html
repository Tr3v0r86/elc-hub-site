/* Shared poster print styles (tools/posters-template/poster.css).
   Inlined into every generated poster by build-qr.py, so all posters share one
   source. Standalone print artifacts, exempt from the app chrome: tokens with
   named-colour fallbacks so a poster still prints if tokens.css is absent.
   No hex values (house rule): CSS named colours only. Print forces pure black
   on white so the QR always scans. A4 portrait, generous margins. */
@page { size: A4 portrait; margin: 22mm; }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--sans, system-ui, sans-serif);
  color: var(--ink, black);
  background: var(--paper, white);
}
.test-banner {
  font-family: var(--mono, ui-monospace, monospace);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.8rem;
  text-align: center;
  padding: 0.6rem 1rem;
  color: var(--paper, white);
  background: var(--red, firebrick);
}
.poster {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 12mm;
  gap: 6mm;
}
.mark {
  font-family: var(--mono, ui-monospace, monospace);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  font-size: 0.9rem;
  color: var(--purple, rebeccapurple);
}
.poster h1 {
  font-family: var(--serif, Georgia, serif);
  font-weight: 600;
  font-size: 2rem;
  line-height: 1.15;
  margin: 0;
  max-width: 22ch;
}
.poster .th { font-size: 1.15rem; margin: 0; max-width: 26ch; }
.poster .sub { font-size: 1.05rem; margin: 0; max-width: 30ch; }
.qr { width: 60%; max-width: 130mm; height: auto; }
.qr-bg { fill: var(--paper, white); }
.qr-fg { fill: var(--ink, black); }
.url {
  font-family: var(--mono, ui-monospace, monospace);
  font-size: 1rem;
  word-break: break-all;
  max-width: 40ch;
  margin: 0;
}
.index-list { list-style: none; padding: 0; margin: 0; }
.index-list li { margin: 0.5rem 0; font-size: 1.05rem; }
.index-list a { font-family: var(--mono, ui-monospace, monospace); }
@media print {
  .test-banner { display: none; }
  .qr-bg { fill: white; }
  .qr-fg { fill: black; }
  .poster { min-height: auto; page-break-after: always; }
}
</style>
