<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ELC Portal idea board</title>
<style>
/* Token VALUES copied from site/assets/tokens.css (internal tooling copy; keep consistent, does not ship to parents). */
:root{
  --paper:#F4F2EA; --paper-2:#ECE9DF; --white:#FBFAF6;
  --ink:#1F1F21; --charcoal:#39393B; --muted:#6F6D64; --faint:#9C9889;
  --rule:#D8D3C6; --rule-2:#E6E2D7;
  --purple:#7D639B; --purple-tint:#ECE5F2; --aubergine:#33254A;
  --gold:#AC9D71; --gold-deep:#8A7A3F; --gold-tint:#EFE9D6;
  --red:#A8443A; --sage:#5B7A4A;
  --sans:"Inter Tight",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --serif:"Newsreader","Times New Roman",Georgia,serif;
  --mono:"Space Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --shadow-hard:3px 3px 0 rgba(31,31,33,0.10);
}
*{box-sizing:border-box;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.45}
header{background:var(--aubergine);color:var(--white);font-family:var(--mono);font-size:14px;padding:12px 20px;letter-spacing:.02em}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:14px 20px;border-bottom:1px solid var(--rule);background:var(--paper-2)}
.tabs{display:flex;gap:6px}
.tabs button{font-family:var(--mono);font-size:12px;padding:6px 12px;border:1px solid var(--rule);background:var(--white);color:var(--charcoal);cursor:pointer;border-radius:3px}
.tabs button[aria-pressed="true"]{background:var(--purple);border-color:var(--purple);color:var(--white)}
select,input[type="search"]{font-family:var(--sans);font-size:14px;padding:6px 10px;border:1px solid var(--rule);background:var(--white);color:var(--ink);border-radius:3px}
input[type="search"]{min-width:220px}
.count{font-family:var(--mono);font-size:12px;color:var(--muted);margin-left:auto}
#list{max-width:920px;margin:0 auto;padding:16px 20px 60px}
.row{display:flex;gap:16px;padding:14px 16px;margin-bottom:10px;background:var(--white);border:1px solid var(--rule-2);border-radius:4px;box-shadow:var(--shadow-hard)}
.votes{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px}
.votes button{font-family:var(--mono);font-size:13px;padding:4px 10px;border:1px solid var(--rule);background:var(--paper);color:var(--charcoal);cursor:pointer;border-radius:3px;width:100%}
.votes button.up[aria-pressed="true"]{background:var(--purple-tint);border-color:var(--purple);color:var(--purple)}
.votes button.down[aria-pressed="true"]{background:var(--gold-tint);border-color:var(--gold-deep);color:var(--gold-deep)}
.net{font-family:var(--mono);font-size:14px;font-weight:700;color:var(--charcoal)}
.body h2{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:4px}
.wow{color:var(--gold-deep)}
.chips{margin-bottom:6px}
.chip{display:inline-block;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--rule);border-radius:3px;padding:1px 7px;margin-right:6px}
.body p{font-size:14px;color:var(--charcoal)}
.body .value{color:var(--muted);margin-top:3px}
@media (prefers-reduced-motion: no-preference){ .votes button{transition:background .15s} }
</style>
</head>
<body>
<header>ELC Portal · idea board · internal</header>
<div class="tools">
  <div class="tabs" role="group" aria-label="bucket">
    <button data-bucket="" aria-pressed="true">All</button>
    <button data-bucket="aug" aria-pressed="false">August draft</button>
    <button data-bucket="backlog" aria-pressed="false">Backlog</button>
    <button data-bucket="never" aria-pressed="false">Never</button>
  </div>
  <select id="lens" aria-label="lens"><option value="">all lenses</option></select>
  <input id="q" type="search" placeholder="search ideas" aria-label="search ideas">
  <span id="count" class="count"></span>
</div>
<div id="list"></div>
<script>
const K = new URL(location).searchParams.get('k') || '';
const voter = localStorage['elc-board-voter'] ||= crypto.randomUUID();
const mine = JSON.parse(localStorage['elc-board-votes'] || '{}');
const BUCKETS = { aug: 'August draft', backlog: 'Backlog', never: 'Never' };
let ideas = [], votes = {}, bucket = '', lens = '', q = '';

const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// Same-origin when served by the Worker; absolute when hosted statically at elc-hub.com/ideas/.
const API = location.hostname.endsWith('workers.dev') ? '' : 'https://elc-idea-board.elcportal.workers.dev';
const score = i => votes[i.id]?.score || 0;

async function load() {
  ideas = await (await fetch('ideas.json')).json();
  try {
    const r = await fetch(API + '/api/votes?k=' + encodeURIComponent(K));
    votes = r.ok ? await r.json() : {};
  } catch { votes = {}; }              // API down: counts default to 0, page still renders
  const sel = document.getElementById('lens');
  [...new Set(ideas.map(i => i.lens))].sort().forEach(l => sel.add(new Option(l, l)));
  render();
}

function render() {
  const ql = q.toLowerCase();
  const rows = ideas
    .filter(i => (!bucket || i.decision === bucket) && (!lens || i.lens === lens) &&
                 (!ql || (i.name + ' ' + i.what + ' ' + i.value).toLowerCase().includes(ql)))
    .sort((a, b) => score(b) - score(a) || a.name.localeCompare(b.name));   // score desc, name tiebreak
  document.getElementById('count').textContent = rows.length + ' of ' + ideas.length + ' ideas';
  document.getElementById('list').innerHTML = rows.map(i => {
    const v = votes[i.id] || { up: 0, down: 0, score: 0 };
    const my = mine[i.id] || 0;
    return `<article class="row" data-id="${i.id}">
      <div class="votes">
        <button type="button" class="up" aria-pressed="${my === 1}" aria-label="upvote ${esc(i.name)}" onclick="vote('${i.id}',1)">▲ +${v.up}</button>
        <span class="net">${v.score > 0 ? '+' : ''}${v.score}</span>
        <button type="button" class="down" aria-pressed="${my === -1}" aria-label="downvote ${esc(i.name)}" onclick="vote('${i.id}',-1)">▼ -${v.down}</button>
      </div>
      <div class="body">
        <h2>${esc(i.name)}${i.wow ? ' <span class="wow" title="wow idea">★</span>' : ''}</h2>
        <p class="chips"><span class="chip">${BUCKETS[i.decision] || esc(i.decision)}</span><span class="chip">effort ${esc(i.effort)}</span><span class="chip">${esc(i.lens)}</span></p>
        <p>${esc(i.what)}</p>
        <p class="value">${esc(i.value)}</p>
      </div>
    </article>`;
  }).join('');
}

async function vote(id, dir) {
  const prev = mine[id] || 0;
  const next = prev === dir ? 0 : dir;             // tap again = retract
  mine[id] = next; localStorage['elc-board-votes'] = JSON.stringify(mine);
  const v = votes[id] || { up: 0, down: 0, score: 0 };
  if (prev === 1) v.up = Math.max(0, v.up - 1);
  if (prev === -1) v.down = Math.max(0, v.down - 1);
  if (next === 1) v.up++;
  if (next === -1) v.down++;
  v.score = v.up - v.down;
  votes[id] = v;
  render();                                        // optimistic
  try {
    const r = await fetch(API + '/api/vote?k=' + encodeURIComponent(K), { method: 'POST', body: JSON.stringify({ id, voter, dir: next }) });
    if (r.ok) { votes[id] = await r.json(); render(); }   // authoritative counts re-sort the page
  } catch {}                                       // API down: keep optimistic local counts
}

document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => {
  bucket = b.dataset.bucket;
  document.querySelectorAll('.tabs button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  render();
}));
document.getElementById('lens').addEventListener('change', e => { lens = e.target.value; render(); });
document.getElementById('q').addEventListener('input', e => { q = e.target.value; render(); });
load();
</script>
</body>
</html>
